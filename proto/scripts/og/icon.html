<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>icon</title>
<style>
/* ホーム画面用のアイコン（?bg=1 でミントの地、なしで透明）。favicon.svg と同じカプセル。 */
html, body { margin: 0; background: transparent; }
.box { width: 512px; height: 512px; display: grid; place-items: center; }
.bg { background-color: #bfe8dc; }
svg { width: 78%; height: 78%; }
.bg svg { width: 70%; height: 70%; }
</style>
</head>
<body>
<div class="box" id="box">
  <svg viewBox="0 0 64 64" aria-hidden="true"><g transform="rotate(-16 32 32)"><path d="M6 32a26 26 0 0 0 52 0z" fill="#fff"/><path d="M6 32a26 26 0 0 1 52 0z" fill="#ffc928"/><path d="M12.5 23.5a21 21 0 0 1 6.5-8" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".9"/><path d="M21 23.5 32 13.5l11 10h-3V32H24v-8.5z" fill="#fff" stroke="#1f2430" stroke-width="3" stroke-linejoin="round"/><rect x="29.6" y="25" width="4.8" height="7" rx="1" fill="#1f2430"/><path d="M6 32h52" stroke="#1f2430" stroke-width="4"/><circle cx="32" cy="32" r="26" fill="none" stroke="#1f2430" stroke-width="5"/></g></svg>
</div>
<script>
if (new URLSearchParams(location.search).get('bg')) document.getElementById('box').classList.add('bg')
</script>
</body>
</html>
