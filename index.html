<title>ねだんカメラ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=M+PLUS+Rounded+1c:wght@800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style id="app-css">
/* ============ tokens ============ */
:root{
  color-scheme:light;
  --bg:#F2F3EE; --surface:#FFFFFF; --surface2:#E7E9E1; --ink:#20242E; --sub:#5C6273;
  --line:#D7DACF; --accent:#3A5BA0; --accent-ink:#FFFFFF; --accent-soft:#E2E8F5;
  --ok:#2E7D4F; --warn:#B4842B; --danger:#C0392B; --vf:#171A21; --vf-ink:#E8EAF0;
  --shadow:0 12px 32px rgba(32,36,46,.12);
  --tag:#FFE28A; --tag-ink:#33280A; --tag-price:#C81E1E; --tag-line:#E3BE55; --tag-sub:#7A6320;
  --font-body:'Zen Kaku Gothic New',system-ui,'Hiragino Sans','Yu Gothic',sans-serif;
  --font-disp:'M PLUS Rounded 1c',var(--font-body);
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14161C; --surface:#1D212B; --surface2:#272C38; --ink:#E8EAF0; --sub:#9AA1B4;
    --line:#343A48; --accent:#8AA7E9; --accent-ink:#10131B; --accent-soft:#28324A;
    --ok:#5CBF8A; --warn:#D9A94E; --danger:#E27060; --vf:#0B0D12; --vf-ink:#E8EAF0;
    --shadow:0 12px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14161C; --surface:#1D212B; --surface2:#272C38; --ink:#E8EAF0; --sub:#9AA1B4;
  --line:#343A48; --accent:#8AA7E9; --accent-ink:#10131B; --accent-soft:#28324A;
  --ok:#5CBF8A; --warn:#D9A94E; --danger:#E27060; --vf:#0B0D12; --vf-ink:#E8EAF0;
  --shadow:0 12px 32px rgba(0,0,0,.45);
}
/* ============ base ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--font-body);-webkit-font-smoothing:antialiased}
img,svg,video{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 90px}
/* ============ header ============ */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 14px}
.brand{display:flex;align-items:center;gap:9px}
.brand .mark{color:var(--accent);flex:none;display:flex}
.brand .name{font-size:19px;font-weight:700;letter-spacing:.02em}
.brand .name small{display:block;font-size:10.5px;font-weight:500;color:var(--sub);letter-spacing:.06em;line-height:1.2;margin-top:1px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--sub);
  border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--sub);flex:none}
.chip.is-shared .dot{background:var(--ok)}
.chip.is-local .dot{background:var(--warn)}
/* ============ tabs ============ */
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:13px;padding:4px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 6px;border-radius:10px;
  font-size:13.5px;font-weight:500;color:var(--sub)}
.tab svg{width:16px;height:16px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:0 2px 8px rgba(32,36,46,.10)}
/* ============ viewfinder ============ */
.vf{position:relative;margin-top:14px;border-radius:16px;overflow:hidden;background:var(--vf);color:var(--vf-ink);
  aspect-ratio:4/3;box-shadow:var(--shadow)}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.vf.is-live video{display:block}
.vf .poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:20px}
.vf.is-live .poster{display:none}
.poster .picon{width:52px;height:52px;border-radius:50%;background:rgba(232,234,240,.10);display:flex;align-items:center;justify-content:center}
.poster .picon svg{width:26px;height:26px}
.poster p{margin:0;font-size:13px;color:rgba(232,234,240,.75);max-width:30em}
.poster .err{color:#FFC9A3;font-size:12.5px}
.vf .frame{position:absolute;inset:0;pointer-events:none;display:none}
.vf.is-live .frame{display:block}
.frame span{position:absolute;width:26px;height:26px;border:3px solid rgba(255,255,255,.9)}
.frame .tl{left:8%;top:12%;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.frame .tr{right:8%;top:12%;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.frame .bl{left:8%;bottom:12%;border-right:0;border-top:0;border-radius:0 0 0 6px}
.frame .br{right:8%;bottom:12%;border-left:0;border-top:0;border-radius:0 0 6px 0}
.scanline{position:absolute;left:10%;right:10%;top:18%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(255,120,90,.95),transparent);
  animation:scan 2.1s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(min(38vw,210px))}}
.vf .stopbtn{position:absolute;top:10px;right:10px;display:none;align-items:center;gap:6px;font-size:12px;font-weight:700;
  color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px;backdrop-filter:blur(4px)}
.vf.is-live .stopbtn{display:inline-flex}
.vf .torchbtn{position:absolute;bottom:10px;right:10px;display:none;width:40px;height:40px;border-radius:50%;
  align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35)}
.vf.is-live .torchbtn.avail{display:inline-flex}
.vf .torchbtn.on{background:#F5C542;color:#33280A;border-color:#F5C542}
.vf .torchbtn svg{width:18px;height:18px}
/* ============ buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;
  padding:11px 16px;font-size:14px;font-weight:700;line-height:1.3;transition:transform .06s ease, background-color .12s ease}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-danger{background:var(--surface);border:1px solid var(--danger);color:var(--danger)}
.btn-lg{padding:13px 22px;font-size:15px;border-radius:14px}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.55;cursor:default}
.actionrow{display:flex;gap:9px;margin-top:12px}
.actionrow .btn{flex:1}
/* ============ manual entry ============ */
.manual{display:flex;gap:8px;margin-top:10px}
.manual input{flex:1;min-width:0;padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface);
  font-family:var(--font-mono);font-size:14px;letter-spacing:.05em}
.manual input::placeholder{font-family:var(--font-body);letter-spacing:0;color:var(--sub)}
/* ============ cards ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.hint-empty{margin-top:16px;text-align:center;color:var(--sub);font-size:13px;padding:18px 14px}
.hint-empty .tips{margin-top:6px;font-size:12px}
.hint-empty a{color:var(--accent);font-weight:700;text-decoration:none;cursor:pointer}
/* ============ price tag ============ */
.tagwrap{margin-top:18px;padding:4px 2px}
.tag-card{position:relative;background:var(--tag);color:var(--tag-ink);border:1px solid var(--tag-line);
  border-radius:12px 20px 20px 12px;padding:16px 18px 14px 46px;transform:rotate(-1.3deg);box-shadow:var(--shadow)}
.tag-card::before{content:'';position:absolute;left:15px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--tag-line);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.22)}
@keyframes tagdrop{from{opacity:0;transform:rotate(-5deg) translateY(-14px)}to{opacity:1;transform:rotate(-1.3deg) translateY(0)}}
.tag-card.pop{animation:tagdrop .26s cubic-bezier(.2,.9,.3,1.2)}
.tag-name{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;line-height:1.4}
.tag-name .emoji{font-size:24px;line-height:1}
.tag-price{display:flex;align-items:baseline;gap:5px;margin-top:2px;font-family:var(--font-disp);font-weight:800;color:var(--tag-price)}
.tag-price .yen{font-size:24px}
.tag-price .num{font-size:46px;letter-spacing:.01em;line-height:1.15;font-variant-numeric:tabular-nums}
.tag-price .tax{font-size:11px;font-weight:700;color:var(--tag-sub);margin-left:2px}
.tag-code{font-family:var(--font-mono);font-size:11.5px;color:var(--tag-sub);letter-spacing:.06em;margin-top:2px}
.tag-actions{display:flex;gap:8px;margin-top:12px}
.tag-actions .btn{background:rgba(255,255,255,.55);border:1px solid var(--tag-line);color:var(--tag-ink)}
.tag-note{font-size:11px;color:var(--tag-sub);margin-top:8px}
/* unknown result */
.unknown-card{margin-top:16px;border:1.5px dashed var(--line);border-radius:14px;padding:18px 16px;text-align:center;background:var(--surface)}
.unknown-card .code{font-family:var(--font-mono);font-size:15px;letter-spacing:.08em;margin:4px 0 2px;word-break:break-all}
.unknown-card p{margin:2px 0 12px;color:var(--sub);font-size:13px}
.unknown-card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.busy-card{margin-top:16px;text-align:center;color:var(--sub);font-size:13.5px;padding:20px}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;vertical-align:-4px;margin-right:8px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ============ history ============ */
.hist{margin-top:20px}
.hist-head{display:flex;align-items:baseline;gap:10px;padding:0 2px 8px}
.hist-head .label{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.05em}
.hist-head .total{margin-left:auto;font-family:var(--font-disp);font-weight:800;font-size:21px;font-variant-numeric:tabular-nums}
.hist-head .count{font-size:11.5px;color:var(--sub)}
.hist-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hist-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.hist-row:first-child{border-top:0}
.hist-row .emoji{font-size:18px;flex:none;width:24px;text-align:center}
.hist-row .hname{flex:1;min-width:0;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-row .htime{font-size:10.5px;color:var(--sub);flex:none}
.hist-row .hprice{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.hist-row .hdel{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.hist-row .hdel svg{width:13px;height:13px}
.hist-row .hdel:hover{background:var(--surface2);color:var(--danger)}
.hist-clear{margin-top:8px;text-align:right}
/* ============ items tab ============ */
.items-head{display:flex;align-items:center;gap:10px;margin-top:16px;padding:0 2px}
.items-head h2{margin:0;font-size:16px;font-weight:700}
.items-head .count{font-size:12px;color:var(--sub)}
.items-head .btn{margin-left:auto}
.search{position:relative;margin-top:12px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--sub)}
.search input{width:100%;padding:10px 13px 10px 36px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:14px}
.search input::placeholder{color:var(--sub)}
.item-list{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 13px;border-top:1px solid var(--line)}
.item-row:first-child{border-top:0}
.item-row:hover{background:var(--surface2)}
.item-row .avatar{flex:none;width:40px;height:40px;border-radius:11px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:20px}
.item-row .mid{flex:1;min-width:0}
.item-row .iname{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-row .icode{font-family:var(--font-mono);font-size:10.5px;color:var(--sub);letter-spacing:.05em}
.item-row .iprice{flex:none;font-weight:700;font-size:15.5px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:9.5px;font-weight:700;border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.badge.demo{background:var(--accent-soft);color:var(--accent)}
.badge.local{background:var(--surface2);color:var(--warn)}
.items-empty{padding:26px 16px;text-align:center;color:var(--sub);font-size:13px}
.demo-note{margin-top:12px;font-size:12px;color:var(--sub);background:var(--surface2);border-radius:11px;padding:10px 13px;line-height:1.7}
/* ============ sheet ============ */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,18,.5)}
.sheet-panel{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--surface);color:var(--ink);
  border-radius:20px 20px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
@keyframes sheetup{from{transform:translateY(28px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet-panel{animation:sheetup .22s ease-out}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h3{margin:0;font-size:16px;font-weight:700;text-wrap:balance}
.sheet-head .closex{margin-left:auto;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.sheet-head .closex:hover{background:var(--surface2)}
.sheet-head .closex svg{width:15px;height:15px}
.field{margin-top:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px}
.field input[type="text"]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.field .ferr{font-size:11.5px;color:var(--danger);margin-top:4px}
.field .fnote{font-size:11px;color:var(--sub);margin-top:4px}
.pricebox{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:6px 13px}
.pricebox .yen{font-family:var(--font-disp);font-weight:800;font-size:18px;color:var(--sub)}
.pricebox input{flex:1;min-width:0;border:0;background:none;outline:none;padding:5px 0;
  font-family:var(--font-disp);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.coderow{display:flex;gap:8px}
.coderow input{flex:1;min-width:0;font-family:var(--font-mono);letter-spacing:.05em}
.codefixed{font-family:var(--font-mono);font-size:14px;letter-spacing:.07em;background:var(--bg);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;word-break:break-all}
.emojirow{display:flex;flex-wrap:wrap;gap:6px}
.emojirow button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:19px;
  display:flex;align-items:center;justify-content:center}
.emojirow button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.emojirow button.none{font-size:11px;font-weight:700;color:var(--sub);width:auto;padding:0 10px}
.sheet-actions{display:flex;gap:9px;margin-top:20px}
.sheet-actions .btn{flex:1}
/* detail */
.detail-top{display:flex;align-items:center;gap:12px}
.detail-top .avatar{flex:none;width:52px;height:52px;border-radius:14px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:27px}
.detail-top .dname{font-size:16.5px;font-weight:700;line-height:1.45;text-wrap:balance}
.detail-top .dcode{font-family:var(--font-mono);font-size:11px;color:var(--sub);letter-spacing:.05em;word-break:break-all}
.detail-price{margin-top:10px;display:flex;align-items:baseline;gap:4px;font-family:var(--font-disp);font-weight:800;color:var(--tag-price)}
.detail-price .yen{font-size:19px}
.detail-price .num{font-size:36px;font-variant-numeric:tabular-nums}
.detail-price .tax{font-size:11px;color:var(--sub);margin-left:3px;font-family:var(--font-body);font-weight:700}
.barcode-box{margin-top:14px;background:#FFFFFF;border:1px solid var(--line);border-radius:13px;padding:16px 10px;
  display:flex;justify-content:center}
.barcode-note{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.7}
/* ============ toast ============ */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);max-width:min(92vw,480px);z-index:80;
  background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;border-radius:999px;padding:10px 18px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ============ misc ============ */
@media (min-width:640px){
  .wrap{padding-top:26px}
  .vf{aspect-ratio:16/10}
  .sheet{align-items:center;padding:20px}
  .sheet-panel{border-radius:20px}
}
@media (prefers-reduced-motion: reduce){
  .scanline{animation:none}
  .tag-card.pop,.sheet-panel{animation:none}
  .btn:active{transform:none}
}
/* ---- せどり（狙い目） ---- */
.kpi{display:flex;gap:8px;margin-top:14px}
.kpi>div{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 11px}
.kpi .k{font-size:10px;color:var(--sub);font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:var(--font-disp);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.35;margin-top:1px}
.kpi .v.pos{color:var(--ok)}
.sorts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.sortchip{font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--sub)}
.sortchip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.filters{display:flex;gap:8px;margin-top:10px}
.filters .f{flex:1;min-width:0}
.filters label{display:block;font-size:10px;color:var(--sub);font-weight:700;margin-bottom:4px;letter-spacing:.03em}
.filters input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:var(--surface);
  font-size:14px;font-variant-numeric:tabular-nums}
.deal-list{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.deal-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-top:1px solid var(--line)}
.deal-row:first-child{border-top:0}
.deal-row:hover{background:var(--surface2)}
.rank{flex:none;width:27px;height:27px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-disp);font-weight:800;font-size:13px;background:var(--surface2);color:var(--sub)}
.rank.s{background:#F5C542;color:#33280A}
.rank.a{background:var(--accent);color:var(--accent-ink)}
.rank.b{background:var(--accent-soft);color:var(--accent)}
.deal-row .mid{flex:1;min-width:0}
.deal-row .dn{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal-row .dm{font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal-row .right{flex:none;text-align:right}
.deal-row .dp{display:block;font-family:var(--font-disp);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;color:var(--ok);line-height:1.25}
.deal-row .dp.neg{color:var(--danger)}
.deal-row .dp.mute{color:var(--sub)}
.deal-row .dr{display:block;font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.item-row .right{flex:none;text-align:right}

    ready: hasCost(p), sell: sell, cost: cost, ship: ship, fee: fee,

function persistLocal(mutations, doneMsg){

function persistShared(mutations, doneMsg, onStay){
  nsPromise.then(function(ns){
    if (!ns || !state.canWrite){ persistLocal(mutations, doneMsg); return; }
    var newDb = { v: 1, products: {} };
    Object.keys(db.products).forEach(function(c){ newDb.products[c] = db.products[c]; });
    Object.keys(mutations).forEach(function(code){
      if (mutations[code] === null) delete newDb.products[code];
      else newDb.products[code] = mutations[code];
    });
    ssSet(SS_STASH, { mutations: mutations, doneMsg: doneMsg, tab: state.tab });
    var attempt = function(){ return ns.publish(buildDocument(newDb)); };
    attempt().catch(function(err){
      var code = err && err.code;
      if (code === 'conflict') return;                       /* リロードで最新版が届く。stashが再保存を案内する */
      if (code === 'upstream_error' || !code){
        return new Promise(function(res){ setTimeout(res, 500 + Math.random() * 700); })
          .then(attempt)
          .catch(function(err2){
            if (err2 && err2.code === 'conflict') return;
            ssDel(SS_STASH);
            persistLocal(mutations, null);
            toast('共有保存に失敗したため、この端末に保存しました');
            if (onStay) onStay();
          });
      }
      ssDel(SS_STASH);
      if (code === 'rate_limited'){
        toast('保存の間隔が短すぎます。少し待ってからもう一度お試しください');
        if (onStay) onStay();

        markLocalMode();
        persistLocal(mutations, null);
        toast('共有保存ができないビューのため、この端末にのみ保存しました');

      persistLocal(mutations, null);

function processStash(){

  var muts = stash.mutations || {};
  var codes = Object.keys(muts);
  var applied = codes.every(function(c){
    var want = muts[c];
    var got = db.products[c];
    if (want === null) return !got;
    return !!got && got.name === want.name && got.price === want.price;
  });
  if (applied){
    if (stash.doneMsg) setTimeout(function(){ toast(stash.doneMsg); }, 250);
  } else {
    var firstAdd = null;
    codes.some(function(c){ if (muts[c]){ firstAdd = Object.assign({ code: c }, muts[c]); return true; } return false; });

}

function vib(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }
var toastTimer = null;
function toast(msg){
  var t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

/* ---------- scanner ---------- */
var scanner = { stream: null, mode: null, timer: null, zx: null, lastSeen: {}, busy: false, torchOn: false };
var SCAN_FORMATS_NATIVE = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code'];
function zxFormats(ZX){
  return [ZX.BarcodeFormat.EAN_13, ZX.BarcodeFormat.EAN_8, ZX.BarcodeFormat.UPC_A, ZX.BarcodeFormat.UPC_E,
          ZX.BarcodeFormat.CODE_128, ZX.BarcodeFormat.CODE_39, ZX.BarcodeFormat.ITF, ZX.BarcodeFormat.QR_CODE];
}
function makeNativeDetector(){
  if (!('BarcodeDetector' in window)) return Promise.resolve(null);
  return window.BarcodeDetector.getSupportedFormats().then(function(sup){
    var want = SCAN_FORMATS_NATIVE.filter(function(f){ return sup.indexOf(f) >= 0; });
    if (want.indexOf('ean_13') < 0) return null;
    try { return new window.BarcodeDetector({ formats: want }); } catch(e){ return null; }
  }).catch(function(){ return null; });
}
function setPoster(msg, isError){
  var p = $('#poster-msg');
  if (p){ p.textContent = msg; p.classList.toggle('err', !!isError); }
}
function startScan(){
  if (state.scanning) return;
  ensureAudio();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setPoster('この環境ではカメラを起動できません。「写真から読み取る」をお使いください。', true);
    return;
  }
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  }).then(function(stream){
    var vf = $('#vf'), video = $('#vf-video');
    if (!vf || !video || state.tab !== 'scan'){
      stream.getTracks().forEach(function(t){ try { t.stop(); } catch(e){} });
      return;
    }
    scanner.stream = stream;
    state.scanning = true;
    scanner.lastSeen = {};
    vf.classList.add('is-live');
    video.muted = true;
    video.srcObject = stream;
    video.play().catch(function(){});
    var track = stream.getVideoTracks()[0];
    try {
      var caps = track.getCapabilities ? track.getCapabilities() : null;
      if (caps && caps.torch) $('#torchbtn').classList.add('avail');
    } catch(e){}
    return makeNativeDetector().then(function(det){
      if (!state.scanning) return;
      if (det){
        scanner.mode = 'native';
        scanner.timer = setInterval(function(){
          if (!state.scanning || scanner.busy || video.readyState < 2) return;
          scanner.busy = true;
          det.detect(video).then(function(codes){
            if (codes && codes[0] && codes[0].rawValue) onDetect(codes[0].rawValue);
          }).catch(function(){}).then(function(){ scanner.busy = false; });
        }, 180);
      } else if (window.ZXing){
        scanner.mode = 'zxing';
        var ZX = window.ZXing;
        var hints = new Map([[ZX.DecodeHintType.POSSIBLE_FORMATS, zxFormats(ZX)]]);
        scanner.zx = new ZX.BrowserMultiFormatReader(hints, 150);
        var cb = function(result){ if (result && state.scanning) onDetect(result.getText()); };
        if (typeof scanner.zx.decodeFromStream === 'function'){
          scanner.zx.decodeFromStream(stream, video, cb).catch(function(){});
        } else {
          scanner.zx.decodeFromVideoDevice(undefined, video, cb);
        }
      } else {
        stopScan();
        setPoster('読み取りエンジンを読み込めませんでした。通信状況を確認して再読み込みしてください。', true);
      }
    });
  }).catch(function(err){
    var name = err && err.name;
    if (name === 'NotAllowedError' || name === 'SecurityError')
      setPoster('カメラの許可がありませんでした。サイト設定でカメラを許可するか、「写真から読み取る」をお使いください。', true);
    else if (name === 'NotFoundError' || name === 'OverconstrainedError')
      setPoster('カメラが見つかりませんでした。「写真から読み取る」をお使いください。', true);
    else if (name === 'NotReadableError')
      setPoster('カメラを起動できませんでした。ほかのアプリがカメラを使っていないか確認してください。', true);
    else
      setPoster('カメラを起動できませんでした。「写真から読み取る」をお使いください。', true);
  });
}
function stopScan(){
  state.scanning = false;
  if (scanner.timer){ clearInterval(scanner.timer); scanner.timer = null; }
  if (scanner.zx){ try { scanner.zx.reset(); } catch(e){} scanner.zx = null; }
  if (scanner.stream){
    scanner.stream.getTracks().forEach(function(t){ try { t.stop(); } catch(e){} });
    scanner.stream = null;
  }
  scanner.torchOn = false;
  var vf = $('#vf'), video = $('#vf-video'), tb = $('#torchbtn');
  if (video) video.srcObject = null;
  if (vf) vf.classList.remove('is-live');
  if (tb){ tb.classList.remove('avail'); tb.classList.remove('on'); }
}
function toggleTorch(){
  if (!scanner.stream) return;
  var track = scanner.stream.getVideoTracks()[0];
  var next = !scanner.torchOn;
  track.applyConstraints({ advanced: [{ torch: next }] }).then(function(){
    scanner.torchOn = next;
    $('#torchbtn').classList.toggle('on', next);
  }).catch(function(){ toast('この端末ではライトを操作できません'); });
}
function onDetect(raw){
  var code = normalizeCode(raw);
  if (!code) return;
  var now = Date.now();
  var prev = scanner.lastSeen[code] || 0;
  scanner.lastSeen[code] = now;
  if (now - prev <= 1600) return;   /* 映り続けている間は再カウントしない */
  handleFound(code, 'live');
}
function handleFound(code, source){
  var p = getProduct(code);
  state.lastResult = { code: code };
  if (p){
    beep(true); vib(40);
    addHistory(code, p);
    updateHistory();
  } else {
    beep(false); vib([30, 60, 30]);
    if (source === 'live') stopScan();
  }
  updateResult();
}
function addHistory(code, p){
  var c = calc(p);
  state.history.unshift({ code: code, name: p.name, price: p.price, emoji: p.emoji || '',
    profit: c.ready ? c.profit : null, ts: Date.now() });
  if (state.history.length > 80) state.history.length = 80;
  lsSet(LS_HISTORY, state.history);
}

/* ---------- photo decode ---------- */
function fileToImg(file){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onerror = function(){ reject(new Error('read')); };
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = function(){ reject(new Error('img')); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function drawScaled(img, longSide, rot){
  var w = img.naturalWidth, h = img.naturalHeight;
  var scale = Math.min(1, longSide / Math.max(w, h));
  var w2 = Math.max(1, Math.round(w * scale)), h2 = Math.max(1, Math.round(h * scale));
  var canvas = document.createElement('canvas');
  if (rot === 90 || rot === 270){ canvas.width = h2; canvas.height = w2; }
  else { canvas.width = w2; canvas.height = h2; }
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(rot * Math.PI / 180);
  ctx.drawImage(img, -w2 / 2, -h2 / 2, w2, h2);
  ctx.restore();
  return canvas;
}
function decodePhoto(file){
  ensureAudio();
  state.lastResult = { busy: true };
  updateResult();
  var ZX = window.ZXing;
  var zxReader = null;
  if (ZX){
    var hints = new Map([
      [ZX.DecodeHintType.POSSIBLE_FORMATS, zxFormats(ZX)],
      [ZX.DecodeHintType.TRY_HARDER, true]
    ]);
    zxReader = new ZX.BrowserMultiFormatReader(hints);
  }
  Promise.all([fileToImg(file), makeNativeDetector()]).then(function(res){
    var img = res[0], det = res[1];
    if (!det && !zxReader) throw new Error('noengine');
    var attempts = [];
    [1600, 1000, 640].forEach(function(longSide){
      [0, 90, 270].forEach(function(rot){ attempts.push([longSide, rot]); });
    });
    var run = function(i){
      if (i >= attempts.length) return Promise.resolve(null);
      var canvas = drawScaled(img, attempts[i][0], attempts[i][1]);
      var tryNative = det
        ? det.detect(canvas).then(function(codes){ return codes && codes[0] ? codes[0].rawValue : null; }).catch(function(){ return null; })
        : Promise.resolve(null);
      return tryNative.then(function(raw){
        if (raw) return raw;
        if (!zxReader) return null;
        return zxReader.decodeFromImageUrl(canvas.toDataURL('image/png'))
          .then(function(r){ return r ? r.getText() : null; })
          .catch(function(){ return null; });
      }).then(function(raw){
        if (raw) return raw;
        return new Promise(function(r){ setTimeout(r, 0); }).then(function(){ return run(i + 1); });
      });
    };
    return run(0);
  }).then(function(raw){
    if (raw){
      var code = normalizeCode(raw);
      scanner.lastSeen[code] = Date.now();
      handleFound(code, 'photo');
    } else {
      state.lastResult = { photoFail: true };
      updateResult();
    }
  }).catch(function(){
    state.lastResult = { photoFail: true };
    updateResult();
  });
}

/* ---------- rendering ---------- */
function render(){
  var app = $('#app');
  app.textContent = '';
  var chip = el('button', { class: 'chip', id: 'chip', type: 'button', onclick: chipInfo },
    el('span', { class: 'dot' }), el('span', { id: 'chip-label', text: '確認中…' }));
  app.append(
    el('div', { class: 'wrap' },
      el('header', { class: 'top' },
        el('div', { class: 'brand' },
          el('span', { class: 'mark', html: ICONS.logo }),
          el('div', { class: 'name' }, 'ねだんカメラ', el('small', { text: 'かざして、仕入れの狙い目がわかる' }))),
        chip),
      el('nav', { class: 'tabs', role: 'tablist' },
        tabBtn('scan', ICONS.camera, 'スキャン'),
        tabBtn('deals', ICONS.spark, '狙い目'),
        tabBtn('items', ICONS.tag, '商品リスト')),
      el('main', { id: 'view' })),
    el('div', { id: 'sheet-root' }),
    el('div', { class: 'toast', id: 'toast', role: 'status', 'aria-live': 'polite' }));
  updateChip();
  renderView();
}
var TABS = ['scan', 'deals', 'items'];
function tabBtn(tab, icon, label){
  return el('button', {
    class: 'tab', role: 'tab', id: 'tab-' + tab, 'aria-selected': String(state.tab === tab),
    onclick: function(){ switchTab(tab); }
  }, el('span', { html: icon }), label);
}
function switchTab(tab){
  if (state.tab === tab) return;
  if (state.tab === 'scan') stopScan();
  closeSheet();
  state.tab = tab;
  TABS.forEach(function(t){
    var b = $('#tab-' + t);
    if (b) b.setAttribute('aria-selected', String(tab === t));
  });
  renderView();
}
function renderView(){
  var view = $('#view');
  view.textContent = '';
  if (state.tab === 'scan') renderScan(view);
  else if (state.tab === 'deals') renderDeals(view);
  else renderItems(view);
}
function updateChip(){
  var chip = $('#chip'), label = $('#chip-label');
  if (!chip || !label) return;
  chip.classList.remove('is-shared', 'is-local');
  if (state.ns === undefined){ label.textContent = '確認中…'; return; }
  if (state.ns && state.canWrite){ chip.classList.add('is-shared'); label.textContent = 'みんなに共有保存'; }
  else { chip.classList.add('is-local'); label.textContent = 'この端末のみ保存'; }
}
function chipInfo(){
  if (state.ns === undefined) toast('共有保存が使えるか確認しています…');
  else if (state.ns && state.canWrite) toast('登録した商品はこのページに保存され、リンクを開いた全員で共有されます');
  else toast('このビューでは共有保存が使えないため、登録はこの端末にのみ保存されます');
}

function manualLookup(){
  ensureAudio();
  var input = $('#manual-input');
  var code = normalizeCode(input.value);
  if (!code){ toast('番号を入力してください'); return; }
  input.value = '';
  scanner.lastSeen[code] = Date.now();
  handleFound(code, 'manual');
}
function updateResult(){
  var box = $('#result');
  if (!box) return;
  box.textContent = '';
  var r = state.lastResult;
  if (!r){
    var hasDemo = allProducts().some(function(p){ return p.demo; });
    box.append(el('div', { class: 'hint-empty' },
      el('div', null, '読み取った商品の値段がここに表示されます'),
      hasDemo ? el('div', { class: 'tips' },
        '試すには：', el('a', { role: 'button', tabindex: '0', text: '商品リストのデモ商品',
          onclick: function(){ switchTab('items'); },
          onkeydown: function(ev){ if (ev.key === 'Enter') switchTab('items'); } }),
        ' のバーコードを別の画面に表示して読み取ってみてください') : null));
    return;
  }
  if (r.busy){
    box.append(el('div', { class: 'busy-card' }, el('span', { class: 'spin' }), '写真を解析しています…'));
    return;
  }
  if (r.photoFail){
    box.append(el('div', { class: 'unknown-card' },
      el('div', { text: 'バーコードを読み取れませんでした' }),
      el('p', null, 'バーコード全体が大きく・明るく・ピントが合って写るように撮り直してみてください'),
      el('div', { class: 'row' },
        el('button', { class: 'btn btn-ghost btn-sm', type: 'button', onclick: function(){
          state.lastResult = null; updateResult();
        }}, 'とじる'))));
    return;
  }
  var p = getProduct(r.code);
  if (p){
    var tag = el('div', { class: 'tag-card pop' },
      el('div', { class: 'tag-name' },
        p.emoji ? el('span', { class: 'emoji', text: p.emoji }) : null,
        el('span', { text: p.name })),
      el('div', { class: 'tag-price' },
        el('span', { class: 'yen', text: '¥' }),
        el('span', { class: 'num', text: Number(p.price).toLocaleString('ja-JP') }),
        el('span', { class: 'tax', text: '売値' })),
      el('div', { class: 'tag-code', text: r.code }),
      profitStrip(p),
      el('div', { class: 'tag-actions' },
        el('button', { class: 'btn btn-sm', type: 'button', onclick: function(){ openSheet('detail', { code: r.code }); } },
          el('span', { html: ICONS.tag }), '値札を表示'),
        canEdit(r.code) ? el('button', { class: 'btn btn-sm', type: 'button', onclick: function(){ openEdit(r.code); } },
          el('span', { html: ICONS.edit }), '編集') : null),
      el('div', { class: 'tag-note', text: '履歴に追加しました' }));
    box.append(el('div', { class: 'tagwrap' }, tag));
    return;
  }
  box.append(el('div', { class: 'unknown-card' },
    el('div', { text: 'まだ登録されていない商品です' }),
    el('div', { class: 'code', text: r.code }),
    el('p', null, '値段を登録すると、次からはスキャンだけで表示されます'),
    el('div', { class: 'row' },
      el('button', { class: 'btn btn-primary', type: 'button', onclick: function(){
        openSheet('register', { code: r.code, codeEditable: false });
      }}, el('span', { html: ICONS.plus }), 'この商品の値段を登録'),
      el('button', { class: 'btn btn-ghost', type: 'button', onclick: function(){
        state.lastResult = null; updateResult(); startScan();
      }}, 'もう一度スキャン'))));
}
/* スキャン結果の下に出す仕入れ判断（買い / 微妙 / 見送り） */
function profitStrip(p){
  var c = calc(p);
  if (!c.ready){
    return el('div', { class: 'profit-strip' },
      el('span', { class: 'judge mid', text: '仕入れ値なし' }),
      el('span', { class: 'r', text: '編集から仕入れ値を入れると利益を計算します' }));
  }
  var kind = c.profit <= 0 ? 'no' : (isDeal(c) ? 'buy' : 'mid');
  var label = kind === 'buy' ? '買い' : (kind === 'mid' ? '微妙' : '見送り');
  return el('div', { class: 'profit-strip' },
    el('span', { class: 'judge ' + kind, text: label }),
    el('span', { class: 'p', text: signedYen(c.profit) }),
    el('span', { class: 'r', text: '利益率 ' + pct(c.rate) + '・ROI ' + roiText(c) }),
    el('span', { class: 'b', text: '売値 ' + yen(c.sell) + ' − 仕入 ' + yen(c.cost) +
      ' − 手数料 ' + yen(c.fee) + '（' + pct(feeRate(p)) + '）− 送料 ' + yen(c.ship) }));
}
function updateHistory(){
  var box = $('#history');
  if (!box) return;
  box.textContent = '';
  if (!state.history.length) return;
  var total = state.history.reduce(function(s, hh){ return s + (hh.price || 0); }, 0);
  var gain = state.history.reduce(function(s, hh){ return s + (typeof hh.profit === 'number' ? hh.profit : 0); }, 0);
  var gainCount = state.history.filter(function(hh){ return typeof hh.profit === 'number'; }).length;
  var list = el('div', { class: 'hist-list' });
  state.history.slice(0, 30).forEach(function(hh, idx){
    list.append(el('div', { class: 'hist-row' },
      el('span', { class: 'emoji', text: hh.emoji || '・' }),
      el('span', { class: 'hname', text: hh.name }),
      el('span', { class: 'htime', text: fmtTime(hh.ts) }),
      el('span', { class: 'hprice', text: yen(hh.price) }),
      el('button', { class: 'hdel', type: 'button', 'aria-label': 'この行を削除', html: ICONS.x, onclick: function(){
        state.history.splice(idx, 1);
        lsSet(LS_HISTORY, state.history);
        updateHistory();
      }})));
  });
  box.append(
    el('div', { class: 'hist-head' },
      el('span', { class: 'label', text: 'スキャン履歴の合計' }),
      el('span', { class: 'count', text: state.history.length + '点' }),
      el('span', { class: 'total', text: yen(total) })),
    gainCount ? el('div', { class: 'hist-head' },
      el('span', { class: 'label', text: '見込み利益' }),
      el('span', { class: 'count', text: gainCount + '点ぶん' }),
      el('span', { class: 'total', text: signedYen(gain) })) : null,
    list,
    el('div', { class: 'hist-clear' },
      el('button', { class: 'btn btn-ghost btn-sm', type: 'button', onclick: function(ev){
        armConfirm(ev.currentTarget, '履歴をすべて消す', function(){
          state.history = [];
          lsSet(LS_HISTORY, state.history);
          updateHistory();
        });
      }}, '履歴をクリア')));
}
/* 2タップ確認（1回目で赤くなり、3秒以内の2回目で実行） */
function armConfirm(btn, armedLabel, fn){
  if (state.confirmArm && state.confirmArm.btn === btn){
    clearTimeout(state.confirmArm.timer);
    state.confirmArm = null;
    fn();
    return;
  }
  var original = btn.textContent;
  btn.textContent = armedLabel + '？';
  btn.classList.add('btn-danger');
  var timer = setTimeout(function(){
    btn.textContent = original;
    btn.classList.remove('btn-danger');
    state.confirmArm = null;
  }, 3000);
  state.confirmArm = { btn: btn, timer: timer };
}
function canEdit(code){
  if (overlay[code]) return true;
  return !!(state.ns && state.canWrite);
}

function dealList(xs){
  var list = el('div', { class: 'deal-list' });
  xs.forEach(function(x){ list.append(dealRow(x)); });

function updateDealList(){
  var box = $('#deal-box');
  if (!box) return;
  box.textContent = '';
  var q = state.search.trim().toLowerCase();
  var rows = allProducts().filter(function(p){
    if (!q) return true;
    return p.name.toLowerCase().indexOf(q) >= 0 || p.code.indexOf(q) >= 0;
  }).map(function(p){ return { p: p, c: calc(p) }; });

  var deals = [], others = [], todo = [];
  rows.forEach(function(x){
    if (!x.c.ready) todo.push(x);
    else if (isDeal(x.c)) deals.push(x);
    else others.push(x);
  });
  var key = settings.sort;
  var val = function(x){
    if (key === 'rate') return x.c.rate;
    if (key === 'roi') return x.c.roi === null ? -Infinity : x.c.roi;
    return x.c.profit;
  };
  var byVal = function(a, b){ return val(b) - val(a); };
  deals.sort(byVal); others.sort(byVal);

  var kpi = $('#deal-kpi');
  if (kpi){
    kpi.textContent = '';
    kpi.append(
      kpiBox('狙い目', deals.length + '件'),
      kpiBox('見込み利益', signedYen(deals.reduce(function(t, x){ return t + x.c.profit; }, 0)), deals.length > 0),
      kpiBox('必要な仕入れ額', yen(deals.reduce(function(t, x){ return t + x.c.spend; }, 0))));
  }
  var cnt = $('#deal-count');
  if (cnt) cnt.textContent = rows.length + '件から抽出';

  if (deals.length) box.append(dealList(deals));
  else box.append(el('div', { class: 'deal-list' }, el('div', { class: 'items-empty',
    text: rows.length
      ? '今の条件に当てはまる商品はありません。最低利益額や最低利益率を下げると増えます。'
      : 'まだ商品がありません。「商品を追加」から、売値と仕入れ値を入れて登録してください。' })));

  if (others.length){
    box.append(
      el('div', { class: 'sec-head' }, '条件から外れた商品', el('span', { class: 'c', text: others.length + '件' })),
      dealList(others));
  }
  if (todo.length){
    box.append(
      el('div', { class: 'sec-head' }, '仕入れ値が未入力', el('span', { class: 'c', text: todo.length + '件' })),
      dealList(todo));
  }
}

      el('button', { class: 'btn btn-ghost', type: 'button', onclick: function(){ sheetGuard = false; closeSheet(); } }, 'キャンセル'),

  var panel = sheetShell(opts.editing ? '商品を編集' : '値段を登録', body);
  setTimeout(function(){ nameIn.focus(); }, 60);
  return panel;
}
function updateItemListSafe(){
  if (state.tab === 'items') updateItemList();
  else if (state.tab === 'deals') updateDealList();
}
function refreshData(){
  if (state.tab === 'items') updateItemList();
  else if (state.tab === 'deals') updateDealList();
  else { updateResult(); updateHistory(); }
}

/* ---------- boot ---------- */
document.addEventListener('visibilitychange', function(){
  if (document.hidden) stopScan();
});
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape'){ sheetGuard = false; closeSheet(); }
});
render();
processStash();
</script>
