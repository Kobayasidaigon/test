<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清掃状況</title>
<style>
  :root {
    --bg:#f4f6f8; --card:#fff; --border:#e3e8ee; --text:#1f2a33; --muted:#7b8a99;
    --head:#1976d2; --ok:#2e7d32; --mid:#ef6c00; --low:#c62828;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size:15px; line-height:1.5; }
  header { background:var(--head); color:#fff; padding:14px 16px 16px; }
  header h1 { margin:0; font-size:1.15rem; }
  header .sub { font-size:.78rem; opacity:.92; margin-top:3px; }
  .wrap { padding:12px 16px 40px; max-width:720px; margin:0 auto; }
  .note { background:#fff8e1; border:1px solid #ffe0a3; color:#7a5800;
    border-radius:10px; padding:9px 12px; font-size:.78rem; margin-bottom:12px; }
  .store { background:var(--card); border:1px solid var(--border); border-radius:12px;
    margin-bottom:14px; overflow:hidden; }
  .store > h2 { margin:0; padding:11px 14px; font-size:1rem; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .store > h2 .n { font-size:.78rem; color:var(--muted); font-weight:400; }
  .area { border-bottom:1px solid #f0f3f6; }
  .area:last-child { border-bottom:0; }
  .area > button { width:100%; background:none; border:0; padding:10px 14px; font:inherit;
    color:inherit; display:flex; align-items:center; gap:10px; text-align:left; cursor:pointer; }
  .area > button .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cnt { font-variant-numeric:tabular-nums; font-weight:700; font-size:.85rem; }
  .cnt.full { color:var(--ok); } .cnt.part { color:var(--mid); } .cnt.none { color:var(--low); }
  .bar { height:4px; background:#eceff1; border-radius:3px; width:54px; flex:0 0 auto; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--ok); }
  .caret { color:var(--muted); font-size:.75rem; width:12px; flex:0 0 auto; }
  .body { display:none; padding:0 14px 12px; }
  .area.open .body { display:block; }
  .sec { font-size:.72rem; color:var(--muted); font-weight:700; margin:10px 0 4px;
    border-left:3px solid #cfd8dc; padding-left:7px; }
  .it { display:flex; align-items:flex-start; gap:8px; padding:5px 0; font-size:.88rem;
    border-bottom:1px dotted #eceff1; }
  .tw { flex:1; min-width:0; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:2px; }
  /* 誰がやったか。これが見たくてページを開くので、薄くしすぎない */
  .by { font-size:.72rem; color:var(--ok); font-weight:700; }
  .prev { font-size:.68rem; color:var(--muted); }
  /* 畳んだままでも、その場所を今日やっている人が分かるように */
  .nmwrap { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .who { font-size:.68rem; color:var(--muted); font-weight:400;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .it:last-child { border-bottom:0; }
  .mk { width:17px; height:17px; border-radius:50%; flex:0 0 auto; border:1.5px solid #cfd8dc;
    margin-top:1px; }
  .it.done .mk { background:var(--ok); border-color:var(--ok); position:relative; }
  .it.done .mk::after { content:''; position:absolute; left:5px; top:2px; width:4px; height:8px;
    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
  .it.done .tt { color:var(--ok); }
  .tt { flex:1; min-width:0; }
  .gap { font-size:.68rem; background:#fdecea; color:var(--low); border-radius:8px;
    padding:1px 6px; font-weight:700; flex:0 0 auto; }
  .gap.none { background:#eceff1; color:var(--muted); }
  .idle-head { display:flex; align-items:center; gap:7px; width:100%; font:inherit;
    font-size:.74rem; color:var(--muted); background:#f7f9fb; padding:9px 14px; border:0;
    border-top:1px solid var(--border); text-align:left; cursor:pointer; }
  .idle-note { color:#9fb0c0; font-size:.68rem; }
  .idle-body { display:none; }
  .cnt.idle { color:#b0bec5; }
  .cnt.plain { color:var(--muted); font-weight:400; font-size:.75rem; }
  /* 店舗の中の区切り。やることリスト / 清掃エリア / 定期清掃 の3つに分ける */
  .grp { display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    font-size:.72rem; font-weight:700; color:var(--muted); letter-spacing:.04em;
    background:#f7f9fb; padding:7px 14px; border-top:1px solid var(--border); }
  .grp:first-of-type { border-top:0; }
  .gnote { font-weight:400; color:#9fb0c0; font-size:.68rem; }
  .gdue { color:var(--low); font-size:.68rem; font-weight:700; }
  /* 定期清掃の1件。毎日の項目と違い、チェックではなく「次にやる日」で見る */
  .pit { padding:7px 0 7px 9px; border-bottom:1px dotted #eceff1;
    border-left:3px solid #cfd8dc; margin-top:2px; }
  .pit:last-child { border-bottom:0; }
  .pit.due { border-left-color:var(--low); }
  .pit.soon { border-left-color:var(--mid); }
  .pit.ok { border-left-color:var(--ok); }
  .ptt { display:block; font-size:.88rem; }
  .pst { display:inline-block; font-size:.7rem; font-weight:700; border-radius:8px;
    padding:1px 6px; margin-top:3px; background:#eceff1; color:var(--muted); }
  .pit.due .pst { background:#fdecea; color:var(--low); }
  .pit.soon .pst { background:#fff6e5; color:var(--mid); }
  .psub { font-size:.68rem; color:var(--muted); margin-left:6px; }
  /* 日付を選ぶ行。他の日を見たいという話があったので足した */
  .dayrow { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .dayrow button { font:inherit; font-size:1.1rem; line-height:1; padding:9px 13px;
    background:var(--card); border:1px solid var(--border); border-radius:9px;
    color:var(--text); cursor:pointer; flex:0 0 auto; }
  .dayrow button:disabled { color:#cfd8dc; cursor:default; }
  .dayrow button.today { font-size:.8rem; font-weight:700; padding:10px 12px; }
  .dayrow input[type=date] { flex:1; min-width:0; font:inherit; font-size:.92rem;
    padding:9px 10px; border:1px solid var(--border); border-radius:9px;
    background:var(--card); color:var(--text); }
  footer { color:var(--muted); font-size:.72rem; text-align:center; padding:4px 16px 30px; }
  .err { padding:30px 16px; text-align:center; color:var(--muted); }
  .login { background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:20px 16px; text-align:center; }
  .login p { margin:0 0 14px; font-size:.86rem; color:var(--muted); }
  .login input { width:100%; max-width:260px; padding:11px 12px; font-size:1rem;
    border:1px solid var(--border); border-radius:9px; text-align:center; }
  .login button { margin-top:12px; width:100%; max-width:260px; padding:11px;
    font-size:1rem; font-weight:700; color:#fff; background:var(--head);
    border:0; border-radius:9px; cursor:pointer; }
  .login .ng { color:var(--low); font-size:.8rem; margin-top:10px; min-height:1.2em; }
</style>
</head>
<body>
<header>
  <h1>清掃状況</h1>
  <div class="sub" id="sub">読み込み中…</div>
</header>
<div class="wrap">
  <div id="login" class="login" style="display:none;">
    <p>管理者の合言葉を入れてください</p>
    <input type="password" id="pw" autocomplete="current-password" inputmode="text">
    <button type="button" id="go">見る</button>
    <div class="ng" id="ng"></div>
  </div>
  <div id="content">
  <div class="dayrow">
    <button type="button" id="prev" aria-label="前の日">‹</button>
    <input type="date" id="day">
    <button type="button" id="next" aria-label="次の日">›</button>
    <button type="button" id="toToday" class="today">今日</button>
  </div>
  <div class="note" id="note"></div>
  <div id="main"><div class="err">読み込み中…</div></div>
  </div>
</div>
<footer id="foot">自動で最新になります。開き直すと今の状態になります。</footer>
<script>
// 曜日わけ（区分に【月・木】などと書いてある）の項目は、決まりどおりやっていても
// 日数では必ず空く。アプリ本体と同じく「やるはずだった日のうち飛ばした回数」を数える。
var DAY_GROUPS = [
  { name: '月・木', days: [1, 4] },
  { name: '火・金', days: [2, 5] },
  { name: '水・土', days: [3, 6] }
];
function dayGroupOf(section) {
  var s = String(section || '');
  for (var i = 0; i < DAY_GROUPS.length; i++) {
    if (s.indexOf(DAY_GROUPS[i].name) >= 0) return DAY_GROUPS[i];
  }
  return null;
}
function gapOf(last, group, today) {
  if (!last) return -1;                       // 記録なし
  var end = new Date(today + 'T00:00:00');
  var d = new Date(last + 'T00:00:00');
  if (!(d < end)) return 0;
  var n = 0;
  for (var i = 0; i < 400; i++) {
    d.setDate(d.getDate() + 1);
    if (d > end) break;
    if (!group || group.days.indexOf(d.getDay()) >= 0) n++;
  }
  return n;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function cls(done, total) {
  if (!total) return '';
  if (done >= total) return 'full';
  return done > 0 ? 'part' : 'none';
}
var DOW = ['日', '月', '火', '水', '木', '金', '土'];
function render(d) {
  // サーバーがその日に直してくれる（おかしな日は今日になる）ので、受け取った日に合わせる
  viewDay = d.date === d.today ? '' : d.date;
  var dow = DOW[new Date(d.date + 'T00:00:00').getDay()];
  document.getElementById('sub').textContent = d.isToday
    ? d.date.replace(/-/g, '/') + '（' + dow + '） ' + d.at + ' 現在'
    : d.date.replace(/-/g, '/') + '（' + dow + '）';

  var day = document.getElementById('day');
  day.value = d.date;
  day.max = d.today;
  document.getElementById('next').disabled = d.date >= d.today;
  document.getElementById('toToday').disabled = d.isToday;

  // 断り書きは日によって変える。今日は途中経過だが、昔の日はもう終わった日なので
  // 同じ文だと「まだ増えるのかな」と思わせてしまう。
  document.getElementById('note').innerHTML = d.isToday
    ? 'このページは<b>見るだけ</b>です。チェックは付けられません。<br>'
      + '上の数は<b>その日の途中経過</b>です。夜にまとめて付ける日もあるため、'
      + '日中の数が少なくても終わっていないとは限りません。'
    : 'このページは<b>見るだけ</b>です。チェックは付けられません。<br>'
      + '<b>' + esc(d.date.replace(/-/g, '/')) + '（' + dow + '）の記録</b>を出しています。'
      + '「前回」はその日までで数えています。';

  var h = '';
  d.stores.forEach(function (st) {
    var routines = st.routines || [], areas = st.areas || [], periodic = st.periodic || [];

    // 30日以上まったく記録が無いエリアは、その店舗で使っていない設備のことが多い。
    // 隠さず、下にまとめて「使われていない」と断って出す。
    var live = [], idle = [];
    areas.forEach(function (a) {
      (a.last && gapOf(a.last, null, d.date) <= 30 ? live : idle).push(a);
    });

    // 上の数は「毎日やる分」だけ。使っていない設備で分母が膨らむと、
    // いくらやっても低い数字になって意味をなさない。定期清掃は毎日の仕事では
    // ないので、ここには混ぜず下に別で出す。
    var done = 0, total = 0;
    routines.concat(live).forEach(function (a) { done += a.done; total += a.total; });

    var due = periodic.filter(function (t) { return t.state === 'due'; }).length;
    h += '<div class="store"><h2>' + esc(st.store)
      + '<span class="n">' + done + ' / ' + total + '</span></h2>';

    // ① やることリスト（朝番・中番・遅番）
    if (routines.length) {
      h += '<div class="grp">やることリスト</div>';
      routines.forEach(function (a) { h += areaHtml(a, d, false); });
    }

    // ② 清掃エリア
    h += '<div class="grp">清掃エリア</div>';
    if (!areas.length) h += '<div class="err">エリアがありません</div>';
    live.forEach(function (a) { h += areaHtml(a, d, false); });
    if (idle.length) {
      // 使っていない設備が赤い「0/23」で何行も並ぶと、断り書きがあっても
      // 「全然やっていない」に見える。1行にたたんで、開きたい人だけ開く。
      h += '<button type="button" class="idle-head" data-idle="1">'
        + '<span class="caret">▶</span> しばらく記録がない設備 ' + idle.length + '件'
        + '<span class="idle-note">その店舗では使っていないものかもしれません</span></button>'
        + '<div class="idle-body">';
      idle.forEach(function (a) { h += areaHtml(a, d, true); });
      h += '</div>';
    }

    // ③ 定期清掃（たまにやる仕事）
    h += '<div class="grp">定期清掃' + (d.periodicAsOfToday ? '（今の状態）' : '')
      + (due ? '<span class="gdue">' + due + '件が実施時期です</span>'
             : '<span class="gnote">実施時期のものはありません</span>')
      + '</div>';
    if (!periodic.length) {
      h += '<div class="err">定期清掃がありません</div>';
    } else {
      // 「1/4」のような分数にすると「4件中1件やった」に見えてしまう。
      // 定期清掃は毎日やる仕事ではないので、件数だけを出す。
      h += '<div class="area"><button type="button">'
        + '<span class="caret">▶</span><span class="nm">定期清掃の一覧</span>'
        + '<span class="cnt plain">全' + periodic.length + '件</span>'
        + '</button><div class="body">';
      periodic.forEach(function (t) {
        h += '<div class="pit ' + t.state + '">'
          + '<span class="ptt">' + esc(t.title) + '</span>'
          + '<span class="pst">' + esc(stateLabel(t)) + '</span>'
          + '<span class="psub">' + esc(t.every)
          + (t.last ? '／前回 ' + t.last.slice(5).replace('-', '/') : '／まだやっていません')
          + '</span></div>';
      });
      h += '</div></div>';
    }
    h += '</div>';
  });
  document.getElementById('main').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('[data-idle]'), function (b) {
    b.onclick = function () {
      var open = b.nextElementSibling.style.display === 'block';
      b.nextElementSibling.style.display = open ? 'none' : 'block';
      b.querySelector('.caret').textContent = open ? '▶' : '▼';
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.area > button'), function (b) {
    b.onclick = function () {
      var a = b.parentNode;
      a.classList.toggle('open');
      b.querySelector('.caret').textContent = a.classList.contains('open') ? '▼' : '▶';
    };
  });
}

// 定期清掃1件の状態の言い方。アプリの periodicStatus と同じ言い回しにそろえる。
function stateLabel(t) {
  if (t.state === 'unset') return '日付未設定';
  if (t.state === 'due') return (t.fixed && t.left < 0) ? (-t.left) + '日過ぎています' : '実施時期です';
  if (t.state === 'soon') return 'そろそろ（あと' + t.left + '日）';
  return 'あと' + t.left + '日';
}

// エリア1つぶんの折りたたみ。idle=その店舗では使っていないかもしれない設備
function areaHtml(a, d, isIdle) {
  var pct = a.total ? Math.round(a.done / a.total * 100) : 0;
  var who = (a.who || []).join('・');
  var h = '<div class="area"><button type="button">'
    + '<span class="caret">▶</span>'
    + '<span class="nmwrap"><span class="nm">' + esc(a.name) + '</span>'
    + (who ? '<span class="who">' + esc(who) + '</span>' : '')
    + '</span>'
    + '<span class="bar"><i style="width:' + pct + '%"></i></span>'
    + '<span class="cnt ' + (isIdle ? 'idle' : cls(a.done, a.total)) + '">'
    + a.done + '/' + a.total + '</span>'
    + '</button><div class="body">';
  a.groups.forEach(function (g) {
    if (g.section) h += '<div class="sec">' + esc(g.section) + '</div>';
    g.items.forEach(function (it) {
      // 1行目に項目名、2行目に「誰が・いつ」。1行に詰めると横に溢れる。
      var meta = [];
      if (it.done) {
        if (it.by) meta.push('<span class="by">' + esc(it.by.join('・')) + '</span>');
      } else {
        var gp = gapOf(it.last, dayGroupOf(g.section), d.date);
        if (gp < 0) meta.push('<span class="gap none">記録なし</span>');
        else if (gp >= 2) meta.push('<span class="gap">' + gp
          + (dayGroupOf(g.section) ? '回' : '日') + '空き</span>');
        if (it.last) {
          meta.push('<span class="prev">前回 ' + it.last.slice(5).replace('-', '/')
            + (it.lastBy ? ' ' + esc(it.lastBy.join('・')) : '') + '</span>');
        }
      }
      h += '<div class="it' + (it.done ? ' done' : '') + '">'
        + '<span class="mk"></span>'
        + '<span class="tw"><span class="tt">' + esc(it.title) + '</span>'
        + (meta.length ? '<span class="meta">' + meta.join('') + '</span>' : '')
        + '</span></div>';
    });
  });
  return h + '</div></div>';
}

function showLogin(msg) {
  document.getElementById('login').style.display = '';
  document.getElementById('content').style.display = 'none';
  document.getElementById('foot').style.display = 'none';
  document.getElementById('sub').textContent = '';
  if (msg) document.getElementById('ng').textContent = msg;
  document.getElementById('pw').focus();
}
function showContent() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('content').style.display = '';
  document.getElementById('foot').style.display = '';
}
// いま見ている日。空なら今日。
var viewDay = '';
function load(first) {
  fetch('/view/data' + (viewDay ? '?d=' + encodeURIComponent(viewDay) : ''))
    .then(function (r) {
      if (r.status === 401) { showLogin(first ? '' : '合言葉を入れ直してください'); return null; }
      if (r.status === 503) throw new Error('管理者の合言葉が設定されていません');
      if (!r.ok) throw new Error('読み込めませんでした');
      return r.json();
    })
    .then(function (d) { if (d) { showContent(); render(d); } })
    .catch(function (e) {
      showContent();
      document.getElementById('main').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
      document.getElementById('sub').textContent = '';
    });
}
function login() {
  var pw = document.getElementById('pw');
  var ng = document.getElementById('ng');
  ng.textContent = '';
  fetch('/view/login', { method: 'POST', headers: { 'Content-Type': 'text/plain; charset=utf-8' },
                         body: pw.value })
    .then(function (r) {
      if (r.ok) { pw.value = ''; load(true); return; }
      if (r.status === 429) return r.json().then(function (j) { ng.textContent = j.error; });
      ng.textContent = '合言葉が違います';
    })
    .catch(function () { ng.textContent = 'つながりませんでした'; });
}
// 日付の移動。サーバーが受け取った日を返すので、押したら読み直すだけでよい。
function shiftDay(n) {
  var cur = document.getElementById('day').value;
  if (!cur) return;
  var t = new Date(cur + 'T00:00:00');
  t.setDate(t.getDate() + n);
  var p2 = function (x) { return String(x).padStart(2, '0'); };
  viewDay = t.getFullYear() + '-' + p2(t.getMonth() + 1) + '-' + p2(t.getDate());
  load(false);
}
document.getElementById('prev').onclick = function () { shiftDay(-1); };
document.getElementById('next').onclick = function () { shiftDay(1); };
document.getElementById('toToday').onclick = function () { viewDay = ''; load(false); };
document.getElementById('day').onchange = function () {
  viewDay = this.value;
  load(false);
};
document.getElementById('go').onclick = login;
document.getElementById('pw').onkeydown = function (e) { if (e.key === 'Enter') login(); };
load(true);
setInterval(function () { load(false); }, 5 * 60 * 1000);   // 開きっぱなしでも5分ごとに新しくなる
</script>
</body>
</html>
