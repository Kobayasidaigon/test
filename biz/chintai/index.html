<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--app-head-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iPhone で「ホーム画面に追加」したときの絵（favicon.svg と同じ絵を、180×180 の画像にしたもの）。 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      書体は3つ。
      - BIZ UDPGothic … 見積書の文字（事務の書類でよく使われる、読みやすいゴシック）。
      - BIZ UDGothic … 金額の数字（幅のそろった数字。帳票のけたがそろう）。
      - Zen Kurenaido … 赤ペンの書き込み（手書きふう）。使いすぎない。
    -->
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=Zen+Kurenaido&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--
      スクリプトを切っているとき。道具のページ（/app。ブラウザで描くページ）は、中身が何も出ないので、そのことを伝える。
      静的HTMLのあるページ（#root に data-ssr が付く）では、本文が読めるので、出さない（src/index.css の .nojs-note）。
    -->
    <noscript>
      <style>#root:empty::before { display: none; }</style>
      <p class="nojs-note">
        この道具は、JavaScript を使って、ブラウザの中だけで動きます。ブラウザの設定で JavaScript を有効にして、ページを開き直してください。<br />
        <a href="/">トップページ（道具の説明）へ</a>
      </p>
    </noscript>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
